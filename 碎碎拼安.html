<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>碎碎拼安</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: header + control bar on top; below, a framed board (left, wide) and a scrollable piece tray (right). Dark indigo "night" ground so the fireworks read well; light variant follows the system. */
:root {
  --bg: #f1f0fa;
  --panel: #ffffff;
  --panel-2: #e8e6f6;
  --line: #cfcbe8;
  --fg: #1f1b3d;
  --muted: #6b6690;
  --accent: #e0386a;
  --accent-fg: #ffffff;
  --gold: #c98a00;
  --ok: #1f9d6b;
  --shadow: 0 10px 30px rgba(40, 30, 100, .18);
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14122b; --panel: #1e1b41; --panel-2: #29255a; --line: #3b3678;
    --fg: #f3efe6; --muted: #a8a3cf; --accent: #ff6b8a; --accent-fg: #2a0b16;
    --gold: #ffd166; --ok: #5be0a8; --shadow: 0 12px 34px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14122b; --panel: #1e1b41; --panel-2: #29255a; --line: #3b3678;
  --fg: #f3efe6; --muted: #a8a3cf; --accent: #ff6b8a; --accent-fg: #2a0b16;
  --gold: #ffd166; --ok: #5be0a8; --shadow: 0 12px 34px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body);
  padding-block: 20px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  line-height: 1.5;
}
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(34px, 4.4vw, 52px); margin: 0; letter-spacing: .08em; line-height: 1.1; text-wrap: balance; }
header p { margin: 0; color: var(--muted); font-size: 15px; min-width: 0; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.group { display: flex; align-items: center; gap: 10px; min-width: 0; }
.group label.t { font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper output { min-width: 2.2em; text-align: center; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.grid-label { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.6em; }
input[type=range] { width: 150px; accent-color: var(--accent); }
button, .btn {
  font: inherit; font-size: 14px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 9px; padding: 7px 14px; cursor: pointer; transition: transform .12s, background .15s, border-color .15s;
}
button:hover, .btn:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
button.round { width: 34px; height: 34px; padding: 0; font-size: 18px; line-height: 1; }
button:focus-visible, input:focus-visible, .btn:focus-within { outline: 2px solid var(--gold); outline-offset: 2px; }
.sp { flex: 1; }
.check { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.stat { display: flex; gap: 14px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stat b { color: var(--fg); font-weight: 700; }

.stage { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .12em; display: flex; justify-content: space-between; gap: 8px; }
.progress { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

.boardwrap { display: flex; justify-content: center; }
.board { position: relative; background: var(--panel-2); border-radius: 6px; box-shadow: inset 0 0 0 2px var(--line); touch-action: none; }
.board.hint::before { content: ""; position: absolute; inset: 0; background: var(--img) center / 100% 100% no-repeat; opacity: .2; border-radius: 6px; pointer-events: none; }
.slot { position: absolute; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 22%, transparent); border-radius: 2px; transition: background .15s; }
.slot.near { background: color-mix(in srgb, var(--accent) 28%, transparent); box-shadow: inset 0 0 0 2px var(--accent); }
.board.win .slot { box-shadow: none; }

.tray { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; justify-content: center; overflow-y: auto; padding: 4px; border-radius: 10px; background: var(--panel-2); min-height: 120px; }
.piece { background-repeat: no-repeat; border-radius: 3px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 2px 8px rgba(0,0,0,.28); flex: none; }
.piece:hover { filter: brightness(1.06); }
.piece.drag { position: fixed; z-index: 50; cursor: grabbing; box-shadow: var(--shadow); transform: scale(1.04) rotate(-1.5deg); pointer-events: none; }
.piece.placed { position: absolute; cursor: default; box-shadow: none; border-radius: 0; animation: snap .28s ease-out; }
.board:not(.win) .piece.placed { box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
@keyframes snap { 0% { transform: scale(1.07); filter: brightness(1.3); } 100% { transform: scale(1); filter: none; } }
.ph { flex: none; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); opacity: .5; }
.empty { width: 100%; text-align: center; color: var(--muted); padding: 30px 8px; font-size: 14px; }
.msg { min-height: 22px; font-size: 14px; color: var(--muted); margin-top: 10px; text-align: center; }
.msg.bad { color: var(--accent); }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }
.done { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; pointer-events: none; }
.done.show { display: flex; }
.done .box { pointer-events: auto; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 20px; padding: 26px 34px; text-align: center; box-shadow: var(--shadow); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); max-width: calc(100vw - 32px); }
.done h3 { font-family: var(--font-display); font-weight: 900; font-size: 40px; margin: 0 0 6px; color: var(--gold); letter-spacing: .1em; }
.done p { margin: 0 0 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.done .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.dropmask { position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 80%, transparent); font-size: 22px; font-weight: 700; border: 3px dashed var(--accent); }
.dropmask.show { display: flex; }

@media (max-width: 900px) {
  .stage { grid-template-columns: 1fr; }
  .sp { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .piece.placed, .done .box { animation: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>碎碎拼安</h1>
    <p>把右邊的碎片拖到左邊的畫框裡，拼回完整的圖片。</p>
  </header>

  <div class="bar">
    <div class="group">
      <label class="t" for="cnt">片數</label>
      <div class="stepper">
        <button class="round" id="minus" aria-label="減少一片">−</button>
        <output id="cntOut">6</output>
        <button class="round" id="plus" aria-label="增加一片">+</button>
      </div>
      <input type="range" id="cnt" min="2" max="48" value="6" aria-label="拼圖片數">
      <span class="grid-label" id="gridLabel">3 × 2</span>
    </div>
    <div class="group">
      <label class="btn" for="file" style="display:inline-block">換圖片…</label>
      <input type="file" id="file" accept="image/*" hidden>
      <button id="resetImg">用預設圖片</button>
    </div>
    <div class="group">
      <button id="shuffle">重新洗牌</button>
      <label class="check"><input type="checkbox" id="hint" checked>顯示淡淡的底圖提示</label>
    </div>
    <div class="sp"></div>
    <div class="stat"><span>時間 <b id="time">0:00</b></span><span>步數 <b id="moves">0</b></span></div>
  </div>

  <div class="stage">
    <section class="card">
      <h2><span>畫框</span><span id="count">0 / 6</span></h2>
      <div class="progress"><i id="bar"></i></div>
      <div class="boardwrap" id="boardwrap"><div class="board hint" id="board"></div></div>
      <div class="msg" id="msg"></div>
    </section>
    <section class="card">
      <h2><span>碎片</span><span>拖曳到左邊對應的位置</span></h2>
      <div class="tray" id="tray"></div>
    </section>
  </div>
</div>

<canvas id="fx"></canvas>
<div class="done" id="done">
  <div class="box">
    <h3>拼好了！</h3>
    <p id="doneInfo"></p>
    <div class="row">
      <button class="primary" id="again">再玩一次</button>
      <button id="moreFx">再放一次煙火</button>
      <button id="closeDone">看看成品</button>
    </div>
  </div>
</div>
<div class="dropmask" id="dropmask">放開滑鼠，換成這張圖片</div>

  var $ = function (s) { return document.querySelector(s); };

    var trayW = Math.max(160, tray.clientWidth - 8);

    s.backgroundPosition = (-p.c * w) + "px " + (-p.r * h) + "px";

    });

  function rand(a, b) { return a + Math.random() * (b - a); }
  function launch() {
    rockets.push({ x: rand(innerWidth * .12, innerWidth * .88), y: innerHeight + 10, vy: -rand(9, 13), ty: rand(innerHeight * .12, innerHeight * .5), hue: rand(0, 360) });
  }
  function burst(x, y, hue) {
    var cnt = reduce ? 36 : Math.round(rand(70, 120)), two = Math.random() < .4;
    for (var i = 0; i < cnt; i++) {
      var a = Math.random() * Math.PI * 2, sp = rand(1.5, 7.5) * (Math.random() < .25 ? .5 : 1);
      var h = two && i % 2 ? (hue + 150) % 360 : hue;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: rand(55, 95), hue: h, size: rand(1.6, 3.2) });
    }
  }
  function frame(t) {
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.globalCompositeOperation = "source-over";
    if (t < fxEnd && t - lastLaunch > (reduce ? 900 : 340)) { launch(); if (Math.random() < .5) launch(); lastLaunch = t; }
    rockets = rockets.filter(function (r) {
      r.y += r.vy; r.vy *= 0.985;
      ctx.fillStyle = "hsl(" + r.hue + ",100%,80%)"; ctx.beginPath(); ctx.arc(r.x, r.y, 2.2, 0, 6.3); ctx.fill();
      if (r.y <= r.ty || r.vy > -2) { burst(r.x, r.y, r.hue); return false; }
      return true;
    });
    parts = parts.filter(function (p) {
      p.age++; p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.06; p.x += p.vx; p.y += p.vy;
      var k = 1 - p.age / p.life; if (k <= 0) return false;
      ctx.fillStyle = "hsla(" + p.hue + ",100%," + (55 + 25 * k) + "%," + k + ")";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + k), 0, 6.3); ctx.fill();
      return true;
    });
    if (t < fxEnd || parts.length || rockets.length) fxRaf = requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, innerWidth, innerHeight); fxRaf = 0; }
  }
  function startFx(ms) {
    fxEnd = performance.now() + ms;
    if (!fxRaf) fxRaf = requestAnimationFrame(frame);
    launch(); launch(); launch();
  }
  function stopFx() {
    cancelAnimationFrame(fxRaf); fxRaf = 0; parts = []; rockets = []; fxEnd = 0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
  }

  loadImage(DEFAULT_SRC, false);
})();
</script>
